<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Seat Booking Saga</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

  <div id="app" class="w-full max-w-4xl p-6">
    <div id="auth-view" class="bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md mx-auto">
      <h2 class="text-3xl font-bold mb-6 text-indigo-400">Login</h2>
      <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-indigo-500">
      <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-indigo-500">
      <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded font-bold transition">Sign In</button>
      <p id="auth-msg" class="text-red-400 mt-4 text-sm"></p>
    </div>

    <div id="booking-view" class="hidden">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-indigo-400">Select a Seat</h2>
        <div class="flex items-center space-x-4">
          <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm font-medium">● Connected to Stream</span>
          <button onclick="logout()" class="text-sm text-gray-400 hover:text-white transition">Logout</button>
        </div>
      </div>
      <div id="seats-container" class="grid grid-cols-3 gap-6 mb-8"></div>
      <div id="status" class="bg-gray-800 p-4 rounded-lg font-mono text-sm border border-gray-700 text-gray-300">Awaiting action...</div>
    </div>
  </div>

  <script>
    let token = "";
    let es = null;
    let refreshTimer = null;

    // View Routing
    function show(id) {
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('booking-view').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    // Auth & Token Rotation
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!res.ok) throw new Error('Login failed');
        const data = await res.json();
        token = data.accessToken;
        
        scheduleRefresh(); // Start background rotation loop
        show('booking-view');
        loadSeats();
        connectSSE();
      } catch (err) {
        document.getElementById('auth-msg').innerText = err.message;
      }
    }

    async function logout() {
      token = "";
      clearTimeout(refreshTimer);
      if (es) { es.close(); es = null; }
      // Attempt to hit logout endpoint if it existed, otherwise just drop state
      show('auth-view');
      document.getElementById('auth-msg').innerText = "Logged out successfully.";
    }

    async function silentRefresh() {
      try {
        const res = await fetch('/api/auth/refresh', { method: 'POST' });
        if (!res.ok) throw new Error('Session expired');
        const data = await res.json();
        token = data.accessToken;
        scheduleRefresh();
      } catch (err) {
        logout();
      }
    }

    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(silentRefresh, (15 * 60 - 60) * 1000); // Refresh 1 min before expiry
    }

    // Seat Data & Real-Time Connection
    async function loadSeats() {
      const res = await fetch('/api/seats', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      const container = document.getElementById('seats-container');
      container.innerHTML = '';
      
      data.seats.forEach(seat => {
        const btn = document.createElement('button');
        btn.id = `seat-${seat.id}`;
        btn.onclick = () => reserveSeat(seat.id);
        updateSeatVisuals(btn, seat.seat_number, seat.status);
        container.appendChild(btn);
      });
    }

    function updateSeatVisuals(element, seatNumber, status) {
      element.className = 'p-6 rounded-xl text-lg font-bold transition-all shadow-lg transform hover:-translate-y-1 active:translate-y-0 disabled:transform-none disabled:cursor-not-allowed';
      element.disabled = status !== 'AVAILABLE';
      
      if (status === 'AVAILABLE') {
        element.classList.add('bg-slate-700', 'hover:bg-indigo-600', 'text-white');
      } else if (status === 'HELD') {
        element.classList.add('bg-yellow-600/50', 'text-yellow-200', 'border', 'border-yellow-500/30');
      } else {
        element.classList.add('bg-red-900/50', 'text-red-300', 'border', 'border-red-800/50');
      }
      
      element.innerText = `Seat ${seatNumber}\n(${status})`;
    }

    function connectSSE() {
      if (es) es.close();
      es = new EventSource('/api/seats/stream');
      
      es.addEventListener('seatUpdate', (e) => {
        const payload = JSON.parse(e.data);
        const btn = document.getElementById(`seat-${payload.seatId}`);
        if (btn) {
          updateSeatVisuals(btn, payload.seatId, payload.status); // ID matches seat_number in our mock data
          document.getElementById('status').innerText = `Real-time update: Seat ${payload.seatId} is now ${payload.status}`;
        }
      });
      
      es.onerror = () => {
        console.error('SSE connection dropped. Reconnecting...');
        setTimeout(connectSSE, 5000); // Simple backoff logic
      };
    }

    // Action execution
    async function reserveSeat(id) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = `Attempting to hold Seat ${id}...`;
      
      try {
        const res = await fetch(`/api/seats/${id}/hold`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 1 }) // Hardcoded user for this prototype
        });
        
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Conflict');
        }
        statusDiv.innerText = `Success: Seat ${id} HELD for 10 minutes. Proceeding to SAGA reservation...`;
        
        // Auto-advance to full SAGA reservation for the demo
        setTimeout(async () => {
          const reserveRes = await fetch(`/api/seats/${id}/reserve`, {
            method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: 1 })
          });
          const reserveData = await reserveRes.json();
          if (reserveRes.ok) {
            statusDiv.innerText = `SAGA Started: Seat ${id} reserved. Awaiting payment integration for Tx...`;
          }
        }, 1500);

      } catch (err) {
        statusDiv.innerText = `Failed: ${err.message}`;
      }
    }
  </script>
</body>
</html>
