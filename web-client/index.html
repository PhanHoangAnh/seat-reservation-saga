<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Saga Reservation | Dashboard</title>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div id="app" class="w-full max-w-lg bg-slate-800 rounded-3xl shadow-2xl p-8 border border-slate-700">
        
        <div id="login-view">
            <h1 class="text-3xl font-extrabold mb-2 text-white">System Access</h1>
            <p class="text-slate-400 mb-8">Authenticate to start the Saga transaction.</p>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" value="test@saga.test" class="w-full px-4 py-3 bg-slate-700 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 text-white" required>
                <input type="password" id="password" value="securepassword123" class="w-full px-4 py-3 bg-slate-700 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 text-white" required>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Sign In</button>
            </form>
        </div>

        <div id="booking-view" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-white">Reserve Seat</h1>
                <span id="user-badge" class="px-3 py-1 bg-green-900 text-green-300 text-xs rounded-full font-mono">Authenticated</span>
            </div>
            <div id="seat-list" class="grid grid-cols-3 gap-4">
                <button onclick="bookSeat(1)" class="p-4 bg-slate-700 rounded-xl hover:bg-indigo-600 transition">Seat 1</button>
                <button onclick="bookSeat(2)" class="p-4 bg-slate-700 rounded-xl hover:bg-indigo-600 transition">Seat 2</button>
                <button onclick="bookSeat(3)" class="p-4 bg-slate-700 rounded-xl hover:bg-indigo-600 transition">Seat 3</button>
            </div>
            <div id="status-box" class="mt-6 p-4 rounded-xl hidden border">
                <p id="status-msg" class="text-sm font-medium text-center"></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://192.168.101.123:3000"; // Fixed to port 3000
        const AUTH_BASE = "http://192.168.101.123:3001";
        let token = "";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch(`${AUTH_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value 
                })
            });
            if (res.ok) {
                const data = await res.json();
                token = data.accessToken;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('booking-view').classList.remove('hidden');
            } else { alert("Login failed - check credentials"); }
        });

        async function bookSeat(seatId) {
            const statusBox = document.getElementById('status-box');
            const statusMsg = document.getElementById('status-msg');
            statusBox.classList.remove('hidden', 'bg-red-900', 'bg-green-900');
            statusBox.classList.add('bg-slate-700');
            statusMsg.innerText = "Processing Saga Transaction...";

            const res = await fetch(`${API_BASE}/api/book`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ seatId })
            });
            const data = await res.json();
            
            statusBox.classList.remove('bg-slate-700');
            if (res.ok) {
                statusBox.classList.add('bg-green-900', 'border-green-700');
                statusMsg.innerText = `Success: Tx ID ${data.transactionId}`;
            } else {
                statusBox.classList.add('bg-red-900', 'border-red-700');
                statusMsg.innerText = `Error: ${data.error || 'Request failed'}`;
            }
        }
    </script>
</body>
</html>
