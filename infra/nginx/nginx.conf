events { worker_connections 1024; }

http {
    upstream api_gateway { server api-gateway:3000; }
    upstream web_client { server web-client:80; }

    server {
        listen 80;

        # Add Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self'" always;

        # Real-time SSE Stream Location Hook
        location = /api/seats/stream {
            proxy_pass http://api_gateway;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Standard API routes
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Serve Frontend Assets
        location / {
            proxy_pass http://web_client;
            proxy_set_header Host $host;
        }
    }
}
