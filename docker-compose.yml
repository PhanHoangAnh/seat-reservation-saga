services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: saga_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: seat_reservation_system
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga_admin -d seat_reservation_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth:
    build: ./auth-service
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://saga_admin:${POSTGRES_PASSWORD}@db:5432/seat_reservation_system
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  reservation:
    build: ./reservation-service
    ports: ["3002:3002"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://saga_admin:${POSTGRES_PASSWORD}@db:5432/seat_reservation_system
    restart: unless-stopped

  payment:
    build: ./payment-service
    ports: ["3003:3003"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://saga_admin:${POSTGRES_PASSWORD}@db:5432/seat_reservation_system
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be provided}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET must be provided}
      GATEWAY_URL: http://api-gateway:3000
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      reservation:
        condition: service_started
      payment:
        condition: service_started
    environment:
      DATABASE_URL: postgres://saga_admin:${POSTGRES_PASSWORD}@db:5432/seat_reservation_system
      AUTH_SVC: http://auth:3001
      RES_SVC: http://reservation:3002
      PAY_SVC: http://payment:3003
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET must be provided}
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  web-client:
    image: nginx:alpine
    volumes:
      - ./web-client/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - web-client
    restart: unless-stopped
